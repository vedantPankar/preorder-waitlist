[[extensions]]
name = "Pre-order ship date update"
type = "flow_trigger"
handle = "preorder-ship-date-update"
uid = "0d4b23d4-d3ec-1659-4236-6d407ac64f9d1e159bfd"
description = "A pre-order customer should hear about the expected ship date: a reminder before shipping, or a change of date."

[settings]

  [[settings.fields]]
  type = "customer_reference"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Reason"
  description = "reminder (shipping soon) or changed (the expected date moved)"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Product title"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Variant title"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Order name"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Ship date"
  description = "Expected ship date as YYYY-MM-DD"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Product link"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Store domain"
